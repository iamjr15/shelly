shelly_relay_user: shelly-relay
shelly_relay_group: shelly-relay
shelly_relay_data_dir: /var/lib/shelly
shelly_relay_db_path: /var/lib/shelly/relay.db
shelly_relay_bin_dir: /usr/local/bin
shelly_relay_previous_binary_path: "{{ shelly_relay_bin_dir }}/shelly-relay.previous"
shelly_relay_db_snapshot_path: "{{ shelly_relay_data_dir }}/relay.db.pre-migration"
shelly_relay_public_hostname: "{{ shelly_iroh_relay_hostname }}"
shelly_relay_control_addr: 127.0.0.1:8443
shelly_relay_control_upstream: "http://{{ shelly_relay_control_addr }}"
shelly_relay_local_control_url: "http://{{ shelly_relay_control_addr }}"
shelly_relay_control_require_tls: "false"
shelly_relay_control_tls_cert: ""
shelly_relay_control_tls_key: ""
shelly_relay_trust_forwarded_for: "true"
shelly_relay_metrics_addr: 127.0.0.1:9090
shelly_relay_prune_stale_daemons: "false"
shelly_relay_daemon_retention_ms: "31536000000"
shelly_relay_registration_audience: "https://{{ shelly_relay_public_hostname }}"
shelly_relay_control_memory_max: 768M
shelly_iroh_relay_memory_max: 1G
shelly_relay_tasks_max: 1024
shelly_relay_limit_nofile: 65536
shelly_relay_start_limit_burst: 5
shelly_relay_otlp_endpoint: ""
shelly_relay_otlp_sample_rate: "0.01"
shelly_relay_honeycomb_credential: ""
shelly_relay_honeycomb_dataset: ""
shelly_iroh_relay_http_addr: 127.0.0.1:8080
shelly_iroh_relay_https_addr: 127.0.0.1:9443
shelly_iroh_relay_quic_addr: 127.0.0.1:7842
shelly_iroh_relay_upstream: "http://{{ shelly_iroh_relay_http_addr }}"
shelly_iroh_relay_metrics_addr: 127.0.0.1:9091
shelly_iroh_relay_cert_dir: /var/lib/shelly/acme
shelly_iroh_relay_hostname: "relay.shelly.sh"
shelly_iroh_relay_contact_email: "ops@shelly.sh"
shelly_iroh_relay_staging: "false"
shelly_iroh_relay_http_only: "true"
shelly_caddy_acme_email: "{{ shelly_iroh_relay_contact_email }}"
shelly_caddy_read_header_timeout: 10s
shelly_caddy_read_body_timeout: 30s
shelly_relay_binary: ""
shelly_relay_apns_credential: /etc/shelly/secrets/apns.p8
shelly_relay_apns_team_id: ""
shelly_relay_apns_key_id: ""
shelly_relay_apns_topic: app.shelly.ios
shelly_relay_apns_endpoint: https://api.push.apple.com
shelly_relay_fcm_credential: ""
shelly_relay_fcm_endpoint: https://fcm.googleapis.com
