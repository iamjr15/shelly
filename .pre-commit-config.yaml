repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|rust-toolchain\.toml|crates/.*\.rs)$
      - id: shelly-npm-dispatcher
        name: node scripts/test-npm-dispatcher.mjs
        entry: node scripts/test-npm-dispatcher.mjs
        language: system
        pass_filenames: false
        files: ^(package\.json|packages/|scripts/(test-npm-dispatcher|sync-release-version)\.mjs)
      - id: shelly-npm-publish-plan
        name: node scripts/test-npm-publish-plan.mjs
        entry: node scripts/test-npm-publish-plan.mjs
        language: system
        pass_filenames: false
        files: ^(package\.json|packages/|scripts/(test-npm-publish-plan|publish-npm-packages|sync-release-version)\.mjs)
